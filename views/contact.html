<!DOCTYPE html>
<html>
    <head>
        <title>Contact | TK Diamond Drilling</title>
        <link rel="stylesheet" href="../style.css">
    </head>
    <body class="contact">

        <header>
            <img id="header-logo" src="../assets/photos/logo.avif" alt="logo">
            <nav>
                <ul id="site-pages">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="contact.html">CONTACT</a></li>
                </ul>
            </nav>
        </header>
        <!-- ---------------------------------------- -->
        <main>
            <section id="section1">
                <h1>Contact</h1>
                <div id="form-area">
                    <h2>Let's Chat</h2>
                    <form id="contact-form">
                        <div id="row1">
                            <div id="field1">
                                <label for="first-name">First Name</label>
                                <input id="first-name" name="first-name" type="text" required>
                            </div>
                            <div id="field2">
                                <label for="last-name">Last Name</label>
                                <input id="last-name" name="last-name" type="text" required>
                            </div>
                            <div id="field3">
                                <label for="email">Email*</label>
                                <input id="email" name="email" type="email" required>
                            </div>
                        </div>
                        <div id="row2">
                            <div id="field4">
                                <label for="message">Message</label>
                                <textarea id="message" name="message"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </main>
        <!-- ---------------------------------------- -->
        <footer>
            <h3>TK Diamond Drilling</h3>
            <div>
                <ul>
                    <li>
                        <img id="linkedin-icon" src="../assets/icons/linkedin.png">
                        <a href="/">LinkedIn</a>
                    </li>
                    <li>
                        <img id="facebook-icon" src="../assets/icons/facebook.png">
                        <a href="/">Facebook</a>
                    </li>
                    <li>
                        <img id="instagram-icon" src="../assets/icons/instagram.png">
                        <a href="/">Instagram</a>
                    </li>
                </ul>
                <ul>
                    <li><a href="/">Privacy Policy</a></li>
                    <li><a href="/">Accessibility Statement</a></li>
                    <li><a href="/">Terms & Conditions</a></li>
                    <li><a href="/">Refund Policy</a></li>
                </ul>
            </div>
            <hr>
            <p>Smither, British Columbia, Canada</p>
            <p>&copy 2026 TK Diamond Drilling. All rights reserved.<p>
        </footer>

    </body>
</html>
